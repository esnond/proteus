<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img">
<title>the detector fires before the stimulus</title>
<style>text{font-family:sans-serif;fill:#1a1a2e}</style>
<rect width="720" height="260" fill="white"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1a1a2e"/></marker></defs>
<line x1="60" y1="150" x2="660" y2="150" stroke="#1a1a2e" stroke-width="2" marker-end="url(#ah)"/>
<line x1="60" y1="150" x2="60" y2="158" stroke="#8d99ae"/>
<text x="60" y="176" text-anchor="middle" font-size="10" fill="#8d99ae">0 s</text>
<line x1="145" y1="150" x2="145" y2="158" stroke="#8d99ae"/>
<text x="145" y="176" text-anchor="middle" font-size="10" fill="#8d99ae">1 s</text>
<line x1="230" y1="150" x2="230" y2="158" stroke="#8d99ae"/>
<text x="230" y="176" text-anchor="middle" font-size="10" fill="#8d99ae">2 s</text>
<line x1="315" y1="150" x2="315" y2="158" stroke="#8d99ae"/>
<text x="315" y="176" text-anchor="middle" font-size="10" fill="#8d99ae">3 s</text>
<line x1="400" y1="150" x2="400" y2="158" stroke="#8d99ae"/>
<text x="400" y="176" text-anchor="middle" font-size="10" fill="#8d99ae">4 s</text>
<line x1="485" y1="150" x2="485" y2="158" stroke="#8d99ae"/>
<text x="485" y="176" text-anchor="middle" font-size="10" fill="#8d99ae">5 s</text>
<line x1="570" y1="150" x2="570" y2="158" stroke="#8d99ae"/>
<text x="570" y="176" text-anchor="middle" font-size="10" fill="#8d99ae">6 s</text>
<line x1="655" y1="150" x2="655" y2="158" stroke="#8d99ae"/>
<text x="655" y="176" text-anchor="middle" font-size="10" fill="#8d99ae">7 s</text>
<rect x="85" y="70" width="150" height="44" rx="6" fill="#fdecea" stroke="#e63946" stroke-width="1.5"/><text x="160.0" y="88.0" text-anchor="middle" font-size="12">det_fired, all 10 journals</text><text x="160.0" y="103.0" text-anchor="middle" font-size="12">t = 1000 ms</text>
<rect x="300" y="70" width="170" height="44" rx="6" fill="#eaf4f4" stroke="#2a9d8f" stroke-width="1.5"/><text x="385.0" y="88.0" text-anchor="middle" font-size="12">burst stimulus</text><text x="385.0" y="103.0" text-anchor="middle" font-size="12">t = 2000 ms</text>
<rect x="430" y="192" width="190" height="44" rx="6" fill="#eaf4f4" stroke="#2a9d8f" stroke-width="1.5"/><text x="525.0" y="210.0" text-anchor="middle" font-size="12">first ash response</text><text x="525.0" y="225.0" text-anchor="middle" font-size="12">t = 2010 ms</text>
<text x="60" y="246" font-size="10" fill="#8d99ae">10 of 10 burst journals record det_fired before the burst; 0 of 10 fire within 3 s after the stimulus (results/schedule_attack, cal_v12)</text>
</svg>
